name: Construire HELIOS APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -o HELIOS_ULTIMATE_FULL.zip -d .

      - name: Installer Java
        uses: android-actions/setup-android@v4
        with:
          distribution: temurin
          java-version: '17'
        

      - name: Préparer Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
        
      - name: Construire HELIOS
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p HELIOS_ULTIMATE_ANDROID assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HELIOS-APK
          path: HELIOS_ULTIMATE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
