name: Build HELIOS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Version de Sherpa-ONNX utilisée pour les bibliothèques natives ET les sources Kotlin (doivent rester identiques)
      SHERPA_VERSION: "1.12.14"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sherpa-ONNX - bibliothèques natives et API Kotlin
        run: |
          set -e
          mkdir -p dl && cd dl
          curl -fL --retry 3 -o android.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-v${SHERPA_VERSION}-android.tar.bz2"
          tar xjf android.tar.bz2
          cd ..
          mkdir -p app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a; do
            cp -r "dl/jniLibs/$abi" app/src/main/jniLibs/
          done
          ls -R app/src/main/jniLibs
          git clone --depth 1 --branch "v${SHERPA_VERSION}" https://github.com/k2-fsa/sherpa-onnx.git dl/sherpa
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          for f in OnlineRecognizer OnlineStream FeatureConfig HomophoneReplacerConfig QnnConfig; do
            p=$(find dl/sherpa -path '*kotlin-api/*' -name "$f.kt" | head -1)
            if [ -n "$p" ]; then cp "$p" app/src/main/java/com/k2fsa/sherpa/onnx/; echo "copié $f"; else echo "absent (ignoré) : $f"; fi
          done
          test -f app/src/main/java/com/k2fsa/sherpa/onnx/OnlineRecognizer.kt || { echo "ERREUR : OnlineRecognizer.kt introuvable"; exit 1; }

      - name: Modèle de reconnaissance français (Sherpa-ONNX, hors ligne)
        continue-on-error: true
        run: |
          set -e
          mkdir -p dl2 && cd dl2
          curl -fL --retry 3 -o fr.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-fr-2023-04-14.tar.bz2"
          tar xjf fr.tar.bz2
          d=$(ls -d sherpa-onnx-streaming-zipformer-fr-*/ | head -1)
          out=../app/src/main/assets/sherpa-fr
          mkdir -p "$out"
          ls -la "$d"
          cp "$d/tokens.txt" "$out/tokens.txt"
          enc=$(ls "$d"/encoder*int8*.onnx 2>/dev/null | head -1); [ -n "$enc" ] || enc=$(ls "$d"/encoder*.onnx | head -1)
          dec=$(ls "$d"/decoder*.onnx 2>/dev/null | grep -v int8 | head -1); [ -n "$dec" ] || dec=$(ls "$d"/decoder*.onnx | head -1)
          joi=$(ls "$d"/joiner*int8*.onnx 2>/dev/null | head -1); [ -n "$joi" ] || joi=$(ls "$d"/joiner*.onnx | head -1)
          cp "$enc" "$out/encoder.onnx"; cp "$dec" "$out/decoder.onnx"; cp "$joi" "$out/joiner.onnx"
          ls -la "$out"

      - name: Compiler l'APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HELIOS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
