name: Construire HELIOS APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Décompresser le projet
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "HELIOS_ULTIMATE_FULL.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP introuvable"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : aucun fichier settings.gradle trouvé"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projet Android trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          
      - name: Installer Java
        uses: android-actions/setup-android@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
              gradle-version: '8.9'
              
      - name: Construire HELIOS
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug
          
      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: HELIOS-APK
          path: HELIOS_ULTIMATE_FULL/app/build/outputs/apk/debug/app-debug.apk
